id: sessions
version: "1.0.0"
name: Sessions (warehouse)
definition: >
  Session count attached to the warehouse order fact, at the same grain and
  under the same filters as Net Revenue, Orders and AOV. This is deliberately
  NOT the product-analytics session count (S2): S2 is the authoritative source
  for checkout funnel behaviour, but 3.5% of its rows carry an unknown region
  and its hourly counts carry instrumentation noise, so a region-filtered S2
  session total sits about 4.5% below the warehouse figure. Mixing the two
  inside one identity breaks LMDI's conservation guarantee.

  This contract exists so the revenue identity can be evaluated on a single
  analytical population. See ADR-018.
unit: sessions
additive: true

formula:
  base_table: fact_orders
  date_column: order_date
  expression: "SUM(sessions)"
  filters:
    - "order_status IN ('shipped','delivered')"
    - "is_test_account = FALSE"

grain: [date, region, segment, product_category, channel]
column_map:
  date: order_date
  region: region
  segment: segment
  product_category: product_category
  channel: channel

dimensions:
  - {name: region,           cardinality: 4, hierarchy_level: 1}
  - {name: segment,          cardinality: 3, hierarchy_level: 2}
  - {name: product_category, cardinality: 5, hierarchy_level: 3}
  - {name: channel,          cardinality: 4, hierarchy_level: 4}

drivers:
  identity: "traffic input to net_revenue = sessions * conversion_rate * average_order_value * net_realisation"
  children: []

detection:
  seasonality_period: 7
  method: stl_robust_z_pelt
  z_threshold: 3.0
  pelt_penalty: 1.0            # dimensionless BIC multiplier: pen = beta * sigma^2 * log(n)
  min_history_days: 56

materiality:
  # Not calibrated against an event-free null the way net_revenue was
  # (ADR-017). Sessions is used here as an identity factor rather than as an
  # alerting KPI, so this gate is not on the detection path.
  min_abs_effect: 20000.0
  min_abs_effect_unit: sessions
  min_rel_effect_pct: 9.0
  min_duration_days: 3
  rule: "(abs_effect >= min_abs_effect OR rel_effect >= min_rel_effect_pct) AND duration >= min_duration_days"

freshness:
  cadence: daily
  expected_lag_hours: 30
  stale_after_hours: 48

lineage:
  source_id: S1
  source_table: fact_orders
  upstream: [s1.raw_orders]
  owner: "data-platform@company.example"

security:
  classification: internal
  row_filter_by_role:
    ops_lead: "region = :user_region"
    finance_director: "TRUE"
    analytics_lead: "TRUE"
  restricted_columns: {}

business_owner: "VP Revenue Operations"
allowed_levers: []
